name: A4 .NET kinetics core

on:
  push:
    branches:
      - feature/a4-kinetics-core
    paths:
      - 'ChemSim.sln'
      - 'Directory.Build.props'
      - 'src/ChemSim.Kinetics/**'
      - 'tests/ChemSim.Kinetics.Tests/**'
      - '.github/workflows/a4-dotnet.yml'
  pull_request:
    paths:
      - 'ChemSim.sln'
      - 'Directory.Build.props'
      - 'src/ChemSim.Kinetics/**'
      - 'tests/ChemSim.Kinetics.Tests/**'
      - '.github/workflows/a4-dotnet.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a4-dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore ChemSim.sln

      - name: Build
        run: dotnet build ChemSim.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ChemSim.sln --configuration Release --no-build --logger "trx;LogFileName=a4-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a4-dotnet-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
