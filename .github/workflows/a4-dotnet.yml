name: A4 .NET kinetics core

on:
  push:
    branches:
      - feature/a4-kinetics-core
    paths:
      - 'ChemSim.sln'
      - 'Directory.Build.props'
      - 'src/ChemSim.Kinetics/**'
      - 'src/ChemSim.Kinetics.Cli/**'
      - 'tests/ChemSim.Kinetics.Tests/**'
      - '.github/workflows/a4-dotnet.yml'
  pull_request:
    paths:
      - 'ChemSim.sln'
      - 'Directory.Build.props'
      - 'src/ChemSim.Kinetics/**'
      - 'src/ChemSim.Kinetics.Cli/**'
      - 'tests/ChemSim.Kinetics.Tests/**'
      - '.github/workflows/a4-dotnet.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a4-dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore ChemSim.sln

      - name: Build
        run: dotnet build ChemSim.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ChemSim.sln --configuration Release --no-build --logger "trx;LogFileName=a4-tests.trx"

      - name: Standalone CLI real-process smoke (synthetic data, Linux)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/a4-cli-smoke"
          cp tests/ChemSim.Kinetics.Tests/Fixtures/a4-synthetic-request.json "$RUNNER_TEMP/a4-cli-smoke/request.json"
          dotnet src/ChemSim.Kinetics.Cli/bin/Release/net10.0/chemsim-solver.dll \
            --request "$RUNNER_TEMP/a4-cli-smoke/request.json" \
            --response "$RUNNER_TEMP/a4-cli-smoke/response.json"
          python3 - "$RUNNER_TEMP/a4-cli-smoke/response.json" <<'PY'
          import json, math, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              response = json.load(f)
          assert response["contract_version"] == "0.1"
          assert response["kind"] == "simulation_result"
          assert response["request_message_id"] == "a393bcc5-8ef0-4111-9cf8-a7f4a65fbfc6"
          assert response["outcome"] == "completed"
          payload = response["payload"]
          assert payload["reliability"]["data_quality"] == "hypothetical"
          assert len(payload["samples"]) == 3
          last = payload["samples"][-1]
          assert last["time_s"] == 1
          assert abs(last["amounts_mol"]["A"] - math.exp(-0.1)) < 5e-8
          assert abs(sum(last["amounts_mol"].values()) - 1) < 1e-9
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a4-dotnet-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
