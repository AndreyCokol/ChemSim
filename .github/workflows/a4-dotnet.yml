name: A4 .NET kinetics core

on:
  push:
    branches:
      - feature/a4-kinetics-core
    paths:
      - 'ChemSim.sln'
      - 'Directory.Build.props'
      - 'src/ChemSim.Kinetics/**'
      - 'src/ChemSim.Kinetics.Cli/**'
      - 'tests/ChemSim.Kinetics.Tests/**'
      - '.github/workflows/a4-dotnet.yml'
  pull_request:
    paths:
      - 'ChemSim.sln'
      - 'Directory.Build.props'
      - 'src/ChemSim.Kinetics/**'
      - 'src/ChemSim.Kinetics.Cli/**'
      - 'tests/ChemSim.Kinetics.Tests/**'
      - '.github/workflows/a4-dotnet.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a4-dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore ChemSim.sln

      - name: Build
        run: dotnet build ChemSim.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ChemSim.sln --configuration Release --no-build --logger "trx;LogFileName=a4-tests.trx"

      - name: Standalone CLI real-process smoke (synthetic data, Linux)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/a4-cli-smoke"
          cp tests/ChemSim.Kinetics.Tests/Fixtures/a4-synthetic-request.json "$RUNNER_TEMP/a4-cli-smoke/request.json"
          dotnet src/ChemSim.Kinetics.Cli/bin/Release/net10.0/chemsim-solver.dll \
            --request "$RUNNER_TEMP/a4-cli-smoke/request.json" \
            --response "$RUNNER_TEMP/a4-cli-smoke/response.json"
          python3 - "$RUNNER_TEMP/a4-cli-smoke/response.json" <<'PY'
          import json, math, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              response = json.load(f)
          assert response["contract_version"] == "0.1"
          assert response["kind"] == "simulation_result"
          assert response["request_message_id"] == "a393bcc5-8ef0-4111-9cf8-a7f4a65fbfc6"
          assert response["outcome"] == "completed"
          payload = response["payload"]
          assert payload["reliability"]["data_quality"] == "hypothetical"
          assert len(payload["samples"]) == 3
          last = payload["samples"][-1]
          assert last["time_s"] == 1
          assert abs(last["amounts_mol"]["A"] - math.exp(-0.1)) < 5e-8
          assert abs(sum(last["amounts_mol"].values()) - 1) < 1e-9
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a4-dotnet-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  windows-cli-smoke:
    name: Windows x64 self-contained A4 CLI process test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish experimental Windows x64 self-contained CLI
        shell: pwsh
        run: |
          dotnet publish src/ChemSim.Kinetics.Cli/ChemSim.Kinetics.Cli.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false --output "$env:RUNNER_TEMP/a4-published"
          if ($LASTEXITCODE -ne 0) { throw "Windows self-contained publish failed" }

      - name: Execute published CLI with Unicode temporary directory
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "Химия-A4-測試"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $request = Join-Path $dir "request.json"
          $response = Join-Path $dir "response.json"
          Copy-Item "tests/ChemSim.Kinetics.Tests/Fixtures/a4-synthetic-request.json" -Destination $request
          $exe = Join-Path $env:RUNNER_TEMP "a4-published/chemsim-solver.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Published CLI executable missing" }
          & $exe --request $request --response $response
          if ($LASTEXITCODE -ne 0) { throw "Published CLI returned nonzero exit code" }
          if (-not (Test-Path -LiteralPath $response)) { throw "CLI response was not written" }
          $result = Get-Content -LiteralPath $response -Encoding utf8 -Raw | ConvertFrom-Json
          if ($result.contract_version -ne "0.1" -or $result.kind -ne "simulation_result") { throw "Unexpected response contract" }
          if ($result.request_message_id -ne "a393bcc5-8ef0-4111-9cf8-a7f4a65fbfc6") { throw "Response request correlation failed" }
          if ($result.outcome -ne "completed") { throw "Numerical solve did not complete" }
          if ($result.payload.reliability.data_quality -ne "hypothetical") { throw "Synthetic fixture lost quality marker" }
          if ($result.payload.samples.Count -ne 3) { throw "Unexpected sample count" }
          $last = $result.payload.samples[-1]
          if ([math]::Abs([double]$last.time_s - 1.0) -gt 0) { throw "Unexpected final time" }
          if ([math]::Abs([double]$last.amounts_mol.A - [math]::Exp(-0.1)) -gt 0.00000005) { throw "Analytical A(t) mismatch" }
          if ([math]::Abs([double]$last.amounts_mol.A + [double]$last.amounts_mol.B - 1.0) -gt 0.000000001) { throw "Synthetic amount conservation mismatch" }

      - name: Archive experimental Windows CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: a4-windows-x64-cli-experimental
          path: ${{ runner.temp }}/a4-published/*
          if-no-files-found: error
