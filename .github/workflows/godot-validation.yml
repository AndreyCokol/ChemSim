name: Godot validation

concurrency:
  group: godot-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**.gd"
      - "**.tscn"
      - "project.godot"
      - ".github/workflows/godot-validation.yml"
  push:
    branches:
      - main

jobs:
  headless-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Import project and parse scripts
        run: timeout 180s godot --headless --editor --path . --quit
      - name: Run draft codec tests
        run: timeout 180s godot --headless --path . --script res://tests/test_draft_codec.gd --quit-after 3
      - name: Run draft repository tests
        run: timeout 180s godot --headless --path . --script res://tests/test_draft_repository.gd --quit-after 3
      - name: Run visual field tests
        run: timeout 180s godot --headless --path . --script res://tests/test_visual_field.gd --quit-after 3
      - name: Run graph series presentation tests
        run: timeout 180s godot --headless --path . --script res://tests/test_graph_series_view.gd --quit-after 3
      - name: Run main draft-state integration tests
        run: timeout 180s godot --headless --path . --script res://tests/test_main_draft_state.gd --quit-after 3
      - name: Start main scene
        run: timeout 180s godot --headless --path . --quit-after 3
