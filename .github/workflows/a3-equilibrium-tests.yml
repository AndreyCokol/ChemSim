name: A3 equilibrium tests

on:
  push:
    branches:
      - "agent/a3-equilibrium-implementation"
  pull_request:
    paths:
      - "src/chemsim/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/a3-equilibrium-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run A3 benchmark tests
        run: python -m unittest discover -s tests -v
